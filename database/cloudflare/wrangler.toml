# Cloudflare D1 & R2 configuration for AuditAI Backend
name = "auditai-edge-service"
main = "cloudflare_d1_worker.js"
compatibility_date = "2024-09-23"

# Cloudflare D1 SQL Database Binding
[[d1_databases]]
binding = "AUDITAI_D1_DB"
database_name = "auditai-d1-prod"
database_id = "d1-auditai-prod-db-id"
migrations_dir = "migrations"

# Cloudflare R2 Object Storage Bucket Binding (audio recordings, reports, SOP documents)
[[r2_buckets]]
binding = "AUDITAI_R2_STORAGE"
bucket_name = "auditai-recordings-storage"
preview_bucket_name = "auditai-recordings-dev"

[vars]
ENVIRONMENT = "production"
ENABLE_CORS = "true"
ALLOWED_ORIGIN = "*"
