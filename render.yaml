services:
  # AuditAI Backend Express API & BullMQ Workers
  - type: web
    name: auditai-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: REDIS_URL
        fromService:
          type: redis
          name: auditai-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ASSEMBLYAI_FALLBACK_API_KEYS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FALLBACK_API_KEYS
        sync: false
      - key: KNOWLARITY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: TRUST_PROXY
        value: "true"

  # Redis instance for BullMQ queue processing
  - type: redis
    name: auditai-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
